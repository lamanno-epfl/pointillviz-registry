# The tool's environment. pixi builds it exactly as pixi.lock pins it; run
# `pixi lock` after every change to this file, and ship both files.
# PointillViz's tool SDK is not a dependency: PointillViz provides it.
[workspace]
name = "banksy-niches"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = "*"
scipy = "*"
# Dependencies of pybanksy, from conda-forge: they have builds on all four platforms.
numba = "*"
python-igraph = "*"
leidenalg = "*"
# For the check of free memory before the authors' dense matrices are built.
psutil = "*"
# To limit the BLAS threads the authors' per-cell loop would otherwise wake on every product.
threadpoolctl = "*"

[pypi-dependencies]
# The authors' package, exactly as they publish it. It brings anndata, scanpy,
# scikit-learn, umap-learn and matplotlib with it.
pybanksy = "==1.3.5"
