# PointillViz's tool SDK serves the dataset to R from Python, in this same
# environment: that is why python, numpy and scipy are here beside R.
[workspace]
name = "mclust-niches"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
scipy = "*"
r-base = "*"
r-jsonlite = "*"
r-mclust = "*"
