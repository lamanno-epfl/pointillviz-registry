# The tool's environment. pixi builds it exactly as pixi.lock pins it; run
# `pixi lock` after every change to this file, and ship both files.
# PointillViz's tool SDK is not a dependency: PointillViz provides it.
[workspace]
name = "publish-test"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
scipy = "*"
